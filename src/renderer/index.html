<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Space</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="xterm.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cascadia+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ─── Custom Titlebar ─────────────────────── -->
  <header id="titlebar">
    <div class="titlebar-left">
      <div class="app-logo">
        <img src="icons/terminal.svg" width="18" height="18" alt="" />
      </div>
      <span class="app-title">Coding Space</span>
    </div>
    <div class="titlebar-right">
      <button class="titlebar-btn" id="btn-minimize" aria-label="Minimize">
        <img src="icons/minimize.svg" width="12" height="12" alt="" />
      </button>
      <button class="titlebar-btn" id="btn-maximize" aria-label="Maximize">
        <img src="icons/maximize.svg" width="12" height="12" alt="" />
      </button>
      <button class="titlebar-btn btn-close" id="btn-close" aria-label="Close">
        <img src="icons/close.svg" width="12" height="12" alt="" />
      </button>
    </div>
  </header>

  <!-- ─── Main Layout: Sidebar + Center ────────── -->
  <div id="app-shell">

    <!-- ═══ Left Sidebar ═══ -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Projects</h2>
        <div class="sidebar-actions">
          <button class="sidebar-icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
            <img src="icons/settings.svg" width="14" height="14" alt="" />
          </button>
          <button class="sidebar-icon-btn" id="btn-refresh-all" title="Refresh all">
            <img src="icons/refresh.svg" width="14" height="14" alt="" />
          </button>
          <button class="sidebar-icon-btn accent" id="btn-add-project" title="Add project">
            <img src="icons/plus.svg" width="14" height="14" alt="" />
          </button>
        </div>
      </div>

      <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>

      <div id="sidebar-scroll">
        <div id="projects-container"></div>
        <div id="loading-state" class="sidebar-empty">
          <div class="spinner" style="width: 24px; height: 24px; border-width: 3px; margin-bottom: 8px;"></div>
          <p>Loading projects...</p>
        </div>
        <div id="empty-state" class="sidebar-empty" style="display:none;">
          <div class="empty-icon-sm">
            <img src="icons/folder-plus.svg" width="32" height="32" alt="" />
          </div>
          <p>No projects yet</p>
          <button class="btn-primary btn-small" id="btn-add-first">
            <img src="icons/plus.svg" width="12" height="12" alt="" />
            Add Project
          </button>
        </div>
      </div>
    </aside>

    <!-- ═══ Center — Terminal Area ═══ -->
    <main id="terminal-area">
      <!-- Vertical Tab Sidebar -->
      <div id="terminal-tabs" class="terminal-tabs">
        <div class="tab-sidebar-controls">
          <button class="tab-new-btn" id="tab-new-btn" title="New terminal">
            <img src="icons/plus.svg" width="12" height="12" alt="" />
            <span class="tab-new-label">New Tab</span>
          </button>
          <button class="tab-collapse-btn" id="tab-collapse-btn" title="Collapse tabs">
            <img src="icons/chevron.svg" width="12" height="12" alt="" />
          </button>
        </div>
        <div class="tab-list-scroll" id="tab-list-scroll">
          <!-- Tabs injected dynamically -->
        </div>
      </div>

      <!-- Terminal container (xterm renders here) -->
      <div id="terminal-container" class="terminal-container">
        <!-- Welcome screen (shown when no terminal is active) -->
        <div id="terminal-welcome" class="terminal-welcome">
          <div class="welcome-glow"></div>
          <div class="welcome-icon">
            <img src="icons/terminal.svg" width="48" height="48" alt="" />
          </div>
          <h2>Coding Space</h2>

        </div>
      </div>
    </main>

    <aside id="workspace-sidebar" class="workspace-sidebar-collapsed">
      <div class="workspace-sidebar-header">
        <h2 class="sidebar-title">Workspace</h2>
        <button
          class="sidebar-icon-btn workspace-sidebar-toggle"
          id="btn-toggle-workspace-sidebar"
          type="button"
          title="Expand workspace sidebar"
          aria-label="Expand workspace sidebar"
          aria-controls="workspace-sidebar"
          aria-expanded="false"
        >
          <img src="icons/chevron.svg" width="12" height="12" alt="" />
        </button>
      </div>

      <div class="workspace-sidebar-body">
        <section class="workspace-section">
          <h3 class="workspace-section-title">Launch Mode</h3>
          <label class="workspace-toggle" title="Open worktrees in external Windows Terminal">
            <input type="checkbox" id="toggle-external-wt" />
            <span class="workspace-toggle-slider"></span>
            <span class="workspace-toggle-label" data-label-expanded="External WT" data-label-collapsed="Ext">External WT</span>
          </label>
          <label class="workspace-toggle" title="Use tmux for new terminals">
            <input type="checkbox" id="toggle-tmux" checked />
            <span class="workspace-toggle-slider"></span>
            <span class="workspace-toggle-label" data-label-expanded="Use tmux" data-label-collapsed="tmux">Use tmux</span>
          </label>
        </section>

        <section class="workspace-section">
          <h3 class="workspace-section-title">Open Active Worktree</h3>
          <div class="workspace-tool-list">
            <button class="workspace-tool-btn brand-logo-btn" id="btn-antigravity" title="Open in Antigravity" aria-label="Open in Antigravity">
              <span class="workspace-tool-icon"><img src="icons/antigravity.svg" width="16" height="16" alt="" /></span>
              <span class="workspace-tool-text">Antigravity</span>
            </button>
            <button class="workspace-tool-btn brand-logo-btn" id="btn-android-studio" title="Open in Android Studio" aria-label="Open in Android Studio">
              <span class="workspace-tool-icon"><img src="icons/android.svg" width="16" height="16" alt="" /></span>
              <span class="workspace-tool-text">Android Studio</span>
            </button>
            <button class="workspace-tool-btn brand-logo-btn" id="btn-vscode" title="Open in VS Code" aria-label="Open in VS Code">
              <span class="workspace-tool-icon"><img src="icons/code.svg" width="16" height="16" alt="" /></span>
              <span class="workspace-tool-text">VS Code</span>
            </button>
            <button class="workspace-tool-btn brand-logo-btn" id="btn-explorer" title="Open in Explorer" aria-label="Open in Explorer">
              <span class="workspace-tool-icon"><img src="icons/folder.svg" width="16" height="16" alt="" /></span>
              <span class="workspace-tool-text">Explorer</span>
            </button>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <!-- ─── Modal Overlay ───────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Title</h3>
        <button class="btn-icon" id="modal-close-btn">
          <img src="icons/close.svg" width="16" height="16" alt="" />
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <!-- Inline SVG images so currentColor works with CSS -->
  <script>
    document.querySelectorAll('img[src$=".svg"]').forEach(function(img) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', img.src, false);
      xhr.send();
      if (xhr.status === 200 || xhr.status === 0) {
        var div = document.createElement('div');
        div.innerHTML = xhr.responseText.trim();
        var svg = div.querySelector('svg');
        if (svg) {
          svg.setAttribute('width', img.getAttribute('width') || '12');
          svg.setAttribute('height', img.getAttribute('height') || '12');
          if (img.id) svg.id = img.id;
          if (img.className) svg.setAttribute('class', img.className);
          img.parentNode.replaceChild(svg, img);
        }
      }
    });
  </script>

  <script src="../../dist/renderer/app.bundle.js"></script>
</body>
</html>
